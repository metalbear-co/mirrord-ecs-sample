common:
  operator: false
services:
  orders:
    target:
      path: serverless/orders
      namespace: staging
    run:
      # --reload restarts the app when you save a file in app/, so mirrord up keeps running between changes.
      command: ["python", "-m", "uvicorn", "app.main:app", "--port", "8080", "--reload", "--reload-dir", "app"]
